server:
  port: 0

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_main_db
    username: ewm_user
    password: ewm_password

stats-client:
  base-url: http://localhost:9090
  connect-timeout: 500ms
  read-timeout: 1000ms
  hit-max-attempts: 3
  hit-backoff-millis: 200
  hit-backoff-cap-millis: 2000

logging:
  level:
    root: INFO
    ru.practicum.explorewithme.main: DEBUG